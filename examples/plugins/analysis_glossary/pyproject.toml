[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oundnote-analysis-glossary-example"
version = "1.0.0"
description = "Example Oundnote analysis filter plugin."
requires-python = ">=3.11"
dependencies = ["oundnote>=0.5"]

[project.entry-points."oundnote.plugins"]
analysis_glossary = "oundnote_analysis_glossary.plugin:create_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/oundnote_analysis_glossary"]
