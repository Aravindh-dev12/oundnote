<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oundnote Flow Bar</title>
  <link rel="stylesheet" href="/static/css/flowbar.css?v={{ asset_version }}">
</head>
<body>
  <main class="flowbar" id="flowbar">
    <button class="brand-chip" id="brand-chip" type="button" title="Open Oundnote">
      <img src="/static/icons/mark.svg" alt="">
    </button>
    <div class="flow-state">
      <span class="state-dot" id="state-dot"></span>
      <strong id="state-label">Ready</strong>
      <small id="state-detail">Press the circle to start listening</small>
    </div>
    <div class="flow-actions">
      <button class="flow-button secondary hidden" id="pause-button" type="button" aria-label="Pause listening">II</button>
      <button class="flow-button record" id="record-button" type="button" aria-label="Start listening"><span></span></button>
    </div>
  </main>
  <script src="/static/js/flowbar.js?v={{ asset_version }}" defer></script>
</body>
</html>
